name: otel_bloc
description: OpenTelemetry instrumentation for `package:bloc`. A
  `BlocObserver` subclass that emits short event spans on every bloc
  event / state change / error, turning your Tempo trace view into a
  state-machine timeline. Works for both pure-Dart `bloc` apps and
  `flutter_bloc` apps (the latter via the
  `otel_flutter_bloc` overlay).
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_bloc
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  bloc: ^9.0.0
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
