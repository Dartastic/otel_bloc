name: otel_bloc
description: >-
  OpenTelemetry instrumentation for `package:bloc`. A `BlocObserver`
  emitting spans on every bloc event, state change and error, turning traces
  into a state-machine timeline.
version: 0.3.0-wip
repository: https://github.com/dartastic/otel_bloc
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  bloc: ^9.0.0
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
